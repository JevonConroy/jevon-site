<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile Change Log | Jevon Conroy</title>
  <meta name="description" content="Selected notes on updates to public professional profile text for Jevon Conroy.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="canonical" href="https://jevonconroy.com/changelog/">

  <style>
    :root {
      color-scheme: light;
      --text: #1f2933;
      --muted: #52616f;
      --border: #d9e2ec;
      --background: #ffffff;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    .page {
      max-width: 680px;
      margin: 0 auto;
      padding: 72px 24px;
    }

    header {
      margin-bottom: 40px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2.25rem;
      line-height: 1.15;
      font-weight: 650;
      letter-spacing: -0.025em;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 1.1rem;
      line-height: 1.3;
      font-weight: 650;
    }

    p {
      margin: 0 0 14px;
      font-size: 1rem;
    }

    .muted {
      color: var(--muted);
    }

    .back-link {
      display: inline-block;
      margin-bottom: 32px;
      color: var(--muted);
      text-decoration: none;
    }

    .back-link:hover,
    .back-link:focus {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .entry-list {
      margin-top: 32px;
      border-top: 1px solid var(--border);
    }

    .entry-summary {
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
    }

    time {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    a {
      color: var(--text);
      text-decoration: none;
    }

    a:hover,
    a:focus {
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>

<body>
  <div class="page">
    <a class="back-link" href="/">← Home</a>

    <header>
      <h1>Profile Change Log</h1>
      <p class="muted">Selected notes on updates to public professional profile text.</p>
    </header>

    <main>
      <section class="entry-list" aria-label="Change log entries">
        <article class="entry-summary">
          <time datetime="2026-05-18">May 18, 2026</time>
          <h2><a href="/changelog/test/">Changelog test entry</a></h2>
          <p class="muted">A scaffold entry used to test the change-log page structure.</p>
        </article>
      </section>
    </main>
  </div>
</body>
</html>
